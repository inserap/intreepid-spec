dataset: RoadTrafficAccidentLocations
grain: '1 ligne = 1 accident corporel. Aucune colonne de comptage de victimes : ce
  n''est PAS un grain victime ni un grain véhicule impliqué.'
n_cols: 36
n_rows: 267761
perimetre: 'Accidents corporels uniquement (au moins un blessé ou tué), CONFIRMÉ par
  l''humain : les accidents à dégâts matériels seuls ne sont pas collectés à la source.
  Ils ne sont donc pas récupérables ailleurs, et aucun dénominateur « tous accidents
  » n''existe dans ce dataset.'
pieges_transversaux:
- 'PÉRIMÈTRE CORPOREL (CONFIRMÉ) : seuls les accidents avec au moins un blessé ou
  tué sont collectés. Le mot « accident » désigne ici « accident corporel ». Aucun
  ratio calculé sur ce fichier n''est un taux portant sur l''ensemble des accidents,
  et le dénominateur « tous accidents » est introuvable dans ce dataset — il faudrait
  une source externe.'
- 'CODES QUASI-HOMOGRAPHES (CONFIRMÉ) : at0 et at00 sont deux catégories métier distinctes
  dans AccidentType. Aucun cast numérique, aucun filtre par préfixe, aucune troncature
  de longueur sur les colonnes de code — l''égalité stricte est la seule opération
  sûre.'
- 'CODES STOCKÉS EN TEXTE : MunicipalityCode (« 0261 ») et AccidentHour (« 07 ») portent
  des zéros de tête signifiants. Toute conversion en entier détruit le padding et
  casse les jointures ou les tris en aval.'
- 'INSTABILITÉ DE LA MAILLE COMMUNALE (NON TRANCHÉ) : millésime des codes communaux
  inconnu et fusions de communes non documentées sur 2011-2025. Vérifier empiriquement
  (MunicipalityCode × AccidentYear) avant toute série temporelle par commune ; à défaut,
  agréger au canton ou travailler en coordonnées.'
- 'DEUX DÉFINITIONS CONCURRENTES DES ACCIDENTS DE PIÉTONS (RÉSOLU) : le booléen AccidentInvolvingPedestrian
  (11,53 %) est un sur-ensemble du type at8 (11,26 %) ; ≈ 720 accidents d''écart.
  Choisir explicitement l''une des deux selon la question posée et l''indiquer dans
  tout chiffre publié.'
- 'USAGERS VULNÉRABLES MAJORITAIRES : piétons 11,53 % + vélos 24,70 % + motos 20,91
  % = 57,1 % de cases cochées. Ce n''est PAS une part d''accidents (booléens non exclusifs),
  mais cela indique que les usagers non carrossés dominent ce fichier d''accidents
  corporels — logique, puisque l''absence de carrosserie transforme un choc en blessure,
  donc en ligne de ce fichier.'
- 'CATÉGORIES D''USAGERS À PÉRIMÈTRE LARGE ET NON DÉCOUPABLE (CONFIRMÉ) : « vélo »
  inclut les e-bikes, « moto » inclut scooters et cyclomoteurs, et aucune colonne
  ne permet de distinguer les sous-types. Toute tendance sur ces colonnes mélange
  évolution du parc, des vitesses et de l''accidentalité.'
- 'GRANULARITÉ TEMPORELLE : année + mois + jour-de-semaine + heure, mais AUCUN jour
  du mois. Il est donc impossible de reconstruire une date calendaire exacte ou une
  série journalière. Toute jointure avec des données datées (météo, événements, travaux,
  jours fériés) est impossible au jour près.'
- 'PRÉCISION HORAIRE VARIABLE (CONFIRMÉ) : l''heure est toujours renseignée mais parfois
  estimée, sans marqueur distinctif. Résolution d''une heure, fiabilité vraisemblablement
  moindre la nuit.'
- 'REDONDANCE CODE/LIBELLÉ : 5 familles (AccidentType, AccidentSeverityCategory, RoadType,
  AccidentWeekDay, AccidentMonth) portent chacune un code + 4 traductions, soit 25
  des 36 colonnes. Toujours agréger sur le code ; les libellés sont de l''affichage.
  Entropies identiques = redondance stricte confirmée par le profil.'
- 'REDONDANCE GÉOGRAPHIQUE : CantonCode, MunicipalityCode et le couple de coordonnées
  décrivent le même lieu à 3 granularités. Cohérence mutuelle non vérifiable par un
  profil mono-colonne : à valider. Le canton est la maille la plus stable dans le
  temps, la commune la plus fragile, la coordonnée la plus fine et la plus pérenne.'
- 'PAS DE COMPTAGE DE VICTIMES : aucune colonne « nombre de tués / blessés ». Un accident
  avec 5 morts pèse autant qu''un accident avec 1 blessé léger. Ne jamais lire ce
  dataset comme un décompte de victimes.'
- 'BOOLÉENS NON EXCLUSIFS : la somme des trois AccidentInvolving* n''est pas une part
  d''accidents. Utiliser une disjonction (« au moins un des trois »), jamais une addition.'
- 'AUCUNE NOTION DE RESPONSABILITÉ, DE CAUSE NI DE CIRCONSTANCE : « impliqué » ne
  dit ni qui a causé l''accident, ni qui a été blessé. Aucune colonne météo, éclairage,
  état de la chaussée, vitesse ou alcool. Ne jamais lire un booléen comme un indicateur
  de faute, ni inférer une cause depuis AccidentType (qui décrit un déroulement, pas
  une origine).'
- 'ABSENCE DE DÉNOMINATEUR D''EXPOSITION : toutes les concentrations observées (canton,
  commune, heure, jour, mois) reflètent d''abord le volume de trafic et de population.
  Aucune conclusion de risque sans normalisation par une source externe.'
points_a_verifier:
- 'Localisation : géocodage réel ou parfois imputé (centroïde de commune, point kilométrique)
  ? Une imputation créerait de faux amas de points superposés.'
- Complétude de l'année 2025 (les 12 mois sont-ils présents ?) et stabilité du seuil
  d'enregistrement sur 2011-2025.
- 'RoadType : existe-t-il une modalité « inconnu » distincte du fourre-tout rt439
  « autre » ? Sinon rt439 mélange « autre chose » et « non renseigné ».'
points_confirmes:
- SRID = EPSG:2056 (CH1903+ / LV95), unité mètre — les distances euclidiennes sur
  (E, N) sont directement en mètres.
- Périmètre = accidents corporels uniquement, par construction de la collecte à la
  source (les accidents à dégâts matériels seuls ne sont pas enregistrés, et non pas
  filtrés en aval).
- 'at0 (dérapage/perte de maîtrise) et at00 (autres) sont deux modalités officielles
  distinctes du référentiel AccidentType : ne jamais les fusionner ni les préfixer.'
- 'AccidentInvolvingPedestrian est un SUR-ENSEMBLE de AccidentType at8 : le booléen
  marque la présence d''un piéton quel que soit le déroulement, at8 ne qualifie que
  les accidents dont le piéton est le mécanisme principal.'
- 'AccidentInvolvingBicycle a un périmètre LARGE : vélos électriques inclus. AccidentInvolvingMotorcycle
  a un périmètre LARGE : scooters et cyclomoteurs inclus. Aucune colonne ne permet
  de séparer les sous-types.'
- 'AccidentHour est toujours renseignée, au besoin par estimation : pas de sentinelle
  « heure inconnue », pas de tranche artificiellement gonflée, mais une précision
  inégale et non marquée.'
points_non_tranches:
- 'MILLÉSIME DES CODES COMMUNAUX : non déterminé (réponse « je ne sais pas »). Codes
  historiques ou harmonisés — indéterminable par profil mono-colonne. Procédure de
  vérification empirique inscrite dans la fiche de la colonne MunicipalityCode ; repli
  sur la maille cantonale ou spatiale recommandé pour les séries longues.'
