  _indicateurs_usagers:
    description: 'Note transversale sur les trois colonnes `AccidentInvolvingPedestrian`,
      `AccidentInvolvingBicycle` et `AccidentInvolvingMotorcycle`. Sémantique ratifiée
      : implication large (présence de l''usager dans l''accident), et non victimisation.'
    pieges:
    - 'Les trois drapeaux NE FORMENT PAS une partition : leur somme n''atteint que
      57,1 % des lignes et ils peuvent être vrais simultanément (collision vélo/moto,
      piéton renversé par un cycle). Ne jamais les additionner pour obtenir un total
      d''accidents par mode, ni construire une variable ''mode unique'' par priorité
      arbitraire sans documenter la règle.'
    - Il n'existe AUCUN indicateur pour les automobilistes, les poids lourds, les
      transports publics ou les engins agricoles. 'Aucun drapeau à vrai' (~43 % à
      50 % des lignes selon les recouvrements) est un résiduel hétérogène, PAS une
      catégorie 'accident entre voitures'.
    - 'Ces drapeaux marquent une implication, pas une victimisation : combinés à `AccidentSeverityCategory`,
      ils qualifient la gravité de l''ACCIDENT, jamais celle de l''usager du mode
      considéré.'
    - 'Frontière de catégorie à documenter dans toute publication : e-bikes sous `Bicycle`,
      cyclomoteurs sous `Motorcycle`.'
    type_retenu: note transversale (pas une colonne du fichier)
dataset: RoadTrafficAccidentLocations
titre: Localisation des accidents de la circulation routière en Suisse (2011–2025)
